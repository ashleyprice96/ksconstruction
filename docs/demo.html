<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211F20">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>K-S Claims Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: site-office app. Charcoal header band with an orange rule, one working column, cards only for forms and tables. */
:root {
  --charcoal: #211F20; --orange: #D37C46; --orange-ink: #A9551F; --orange-soft: #F8EADF;
  --bg: #F5F2F0; --surface: #FFFFFF; --ink: #262324; --muted: #6E6668; --line: #E3DCD8; --row: #FBF8F6;
  --ok: #2E7A4D; --ok-soft: #E2F1E7; --warn: #8F5600; --warn-soft: #FFF0D3; --bad: #B0281F; --bad-soft: #FBE3E0;
  --head-ink: #FFFFFF; --head-muted: #CFC7C3; --nav: #2D2A2B;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1A1819; --surface: #252223; --ink: #EEE8E5; --muted: #A99F9B; --line: #3A3536; --row: #2A2627;
  --orange-ink: #E39A69; --orange-soft: #3A2A20; --ok: #6CC495; --ok-soft: #1E3327; --warn: #E5B160; --warn-soft: #3A2E17;
  --bad: #F08A80; --bad-soft: #3D2220; --charcoal: #141213; --nav: #201D1E; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1A1819; --surface: #252223; --ink: #EEE8E5; --muted: #A99F9B; --line: #3A3536; --row: #2A2627;
  --orange-ink: #E39A69; --orange-soft: #3A2A20; --ok: #6CC495; --ok-soft: #1E3327; --warn: #E5B160; --warn-soft: #3A2E17;
  --bad: #F08A80; --bad-soft: #3D2220; --charcoal: #141213; --nav: #201D1E; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--charcoal); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1040px; margin: 0 auto; }
header.top { background: var(--charcoal); color: var(--head-ink); border-bottom: 4px solid var(--orange); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--head-ink); }
.brand img { width: 38px; height: 38px; }
.brand b { font-family: var(--display); font-size: 1.35rem; letter-spacing: 0.04em; line-height: 1; }
.brand small { display: block; font-family: var(--display); color: var(--orange); letter-spacing: 0.16em; font-size: 0.72rem; }
.role { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--head-muted); }
.role select { background: var(--nav); color: var(--head-ink); border: 1px solid #4A4446; border-radius: 6px; padding: 6px 8px; font: inherit; min-height: 36px; }
nav.tabs { background: var(--nav); overflow-x: auto; }
nav.tabs .wrap { display: flex; gap: 2px; }
nav.tabs a { color: #E8E2DF; text-decoration: none; padding: 10px 12px; white-space: nowrap; font-weight: 600; font-size: 0.92rem; border-bottom: 3px solid transparent; }
nav.tabs a:hover, nav.tabs a.on { color: #fff; border-bottom-color: var(--orange); }
nav.tabs a.restricted { color: var(--orange); }
.demo-note { background: var(--orange-soft); color: var(--ink); font-size: 0.85rem; padding-block: 8px; }
.demo-note .wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
main { padding-block: 18px 56px; }
h1, h2, h3 { font-family: var(--display); color: var(--ink); text-wrap: balance; line-height: 1.1; margin: 0; }
h1 { font-size: 2rem; text-transform: uppercase; letter-spacing: 0.01em; }
h2 { font-size: 1.35rem; margin: 26px 0 10px; }
h3 { font-size: 1.1rem; margin: 0 0 8px; }
.eyebrow { font-family: var(--display); color: var(--orange-ink); text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.8rem; font-weight: 700; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); } .small { font-size: 0.86rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.card.accent { border-top: 4px solid var(--orange); }
.stack { display: grid; gap: 16px; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-decoration: none; color: var(--ink); display: grid; gap: 2px; }
.tile .n { font-family: var(--display); font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--muted); font-size: 0.86rem; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
th { background: var(--charcoal); color: #fff; text-align: left; padding: 9px 10px; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 3px solid var(--orange); white-space: nowrap; font-weight: 700; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:nth-child(even) td { background: var(--row); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
a { color: var(--orange-ink); }
label { display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 4px; }
.hint { display: block; font-weight: 400; color: var(--muted); font-size: 0.82rem; }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--orange); outline-offset: 1px; }
textarea { min-height: 80px; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.line { display: grid; grid-template-columns: 1fr 130px; gap: 10px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.wall { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 18px; border-radius: 8px; border: 2px solid var(--orange);
  background: var(--orange); color: #fff; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(0.94); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.danger { background: var(--bad); border-color: var(--bad); }
.btn.sm { min-height: 34px; padding: 4px 10px; font-size: 0.86rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; white-space: nowrap; background: var(--line); color: var(--ink); }
.b-draft { background: var(--line); } .b-awaiting { background: var(--warn-soft); color: var(--warn); } .b-returned { background: var(--bad-soft); color: var(--bad); }
.b-approved { background: var(--ok-soft); color: var(--ok); } .b-paid { background: var(--charcoal); color: #fff; } .b-flag { background: var(--bad-soft); color: var(--bad); }
.alert { padding: 11px 14px; border-radius: 8px; border-left: 5px solid; white-space: pre-line; }
.alert.err { background: var(--bad-soft); border-color: var(--bad); }
.alert.ok { background: var(--ok-soft); border-color: var(--ok); }
.alert.info { background: var(--orange-soft); border-color: var(--orange); }
.alert.warn { background: var(--warn-soft); border-color: var(--warn); }
.steps { display: flex; gap: 4px; overflow-x: auto; }
.steps span { flex: 1 0 auto; text-align: center; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 0.86rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.steps span.on { background: var(--charcoal); color: #fff; border-color: var(--charcoal); }
.steps span.done { color: var(--ok); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs figure { margin: 0; width: 110px; display: grid; gap: 4px; }
.thumbs img { width: 110px; height: 82px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--row); }
.thumbs figcaption { font-size: 0.74rem; color: var(--muted); }
canvas.sig { width: 100%; height: 190px; border: 2px dashed var(--line); border-radius: 8px; background: #fff; touch-action: none; display: block; }
.total { display: flex; justify-content: space-between; font-family: var(--display); font-size: 1.3rem; font-weight: 700; padding-top: 6px; }
.restricted { background: var(--charcoal); color: #fff; border-left: 6px solid var(--orange); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: 0.86rem; } dl.kv dd { margin: 0; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.8rem; }
details summary { cursor: pointer; font-weight: 700; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--charcoal); color: #fff; padding: 10px 16px; border-radius: 8px; border-left: 5px solid var(--orange); z-index: 20; max-width: calc(100% - 32px); }
@media (max-width: 560px) { h1 { font-size: 1.6rem; } .line { grid-template-columns: 1fr 110px; } .role span { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

</head>

    lines: [ { key: "C140", desc: "140 mm commons", unit: "brick", qty: 900, rate: 1.45, from: "Riverside jobs (client-specific)" } ],

function runFor(we) {
  let r = S.runs.find((x) => we >= x.first && we <= x.last);
  if (r && (r.status !== "open" || new Date(r.paylessClose) < new Date())) return { run: S.runs.find((x) => x.status === "open" && x.first > we && new Date(x.paylessClose) > new Date()), late: true };
  return { run: r, late: false };
}
function resolveRate(gangId, clientId, item, date) {
  const g = S.gangs[gangId];
  const order = [g.individual, Object.keys(S.rateSets).find((k) => S.rateSets[k].client === clientId), g.set].filter(Boolean);
  for (const k of order) {
    const r = S.rateSets[k].rates.filter((x) => x.item === item && x.from <= date).sort((a, b) => (a.from < b.from ? 1 : -1))[0];

function draftLines(d) {
  const out = [];
  if (d.type === "substructure") REF.items.forEach((i) => { if (Number(d.qty[i.id]) > 0) out.push({ key: i.id, desc: i.name, unit: i.unit, qty: Number(d.qty[i.id]) }); });

  if (d.type === "daywork" && Number(d.qty.DAYWORK) > 0) out.push({ key: "DAYWORK", desc: "Daywork", unit: "hour", qty: Number(d.qty.DAYWORK) });

  return out;
}
function priceLines(d) {
  const st = site(d.site);
  return draftLines(d).map((l) => {
    let r = null;
    if (l.unit === "%") r = { rate: S.liftValues[l.key], from: "Lift value" };
    else if (l.key === "SUP") r = { rate: S.supervision.find((x) => x.id === l.sup).weekly, from: "Supervision assignment" };
    else r = resolveRate(myGang, st.client, l.key, d.workDate);
    return Object.assign({}, l, r ? { rate: r.rate, from: r.from, value: val({ ...l, rate: r.rate }) } : { rate: null, value: null });
  });
}

let sigData = null;

  const x = c.getContext("2d"); x.scale(r, r); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.lineWidth = 2.5; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#111";
  let down = false, strokes = 0;
  const pos = (e) => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.addEventListener("pointerdown", (e) => { down = true; c.setPointerCapture(e.pointerId); const [a, b] = pos(e); x.beginPath(); x.moveTo(a, b); });
  c.addEventListener("pointermove", (e) => { if (!down) return; const [a, b] = pos(e); x.lineTo(a, b); x.stroke(); strokes++; });
  const up = () => { if (!down) return; down = false; if (strokes > 8) { sigData = c.toDataURL("image/png"); $("#sig-state").textContent = "Signed."; } };
  c.addEventListener("pointerup", up); c.addEventListener("pointerleave", up);
}
async function compress(file, enhance) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 480 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  const x = c.getContext("2d"); x.drawImage(bmp, 0, 0, c.width, c.height);
  if (enhance) {
    const img = x.getImageData(0, 0, c.width, c.height), d = img.data; let lo = 255, hi = 0;
    for (let i = 0; i < d.length; i += 4) { const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; lo = Math.min(lo, y); hi = Math.max(hi, y); }
    for (let i = 0; i < d.length; i += 4) { const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; d[i] = d[i + 1] = d[i + 2] = Math.max(0, Math.min(255, (y - lo) * 255 / Math.max(1, hi - lo))); }

}

function validateStep(d) {
  const e = [];
  if (d.step === 0) { if ((d.type === "substructure" || d.type === "superstructure") && !d.plot) e.push("Choose a plot."); if (!d.workDate) e.push("Enter the work date."); }
  if (d.step === 1) {
    if (!draftLines(d).length) e.push("Enter at least one quantity.");
    if ([...Object.values(d.qty)].some((q) => q !== "" && !(Number(q) >= 0))) e.push("Quantities must be numbers of zero or more.");
    if (d.type === "substructure" && !d.walls.some((w) => w.ref && w.courses !== "")) e.push("Record the course count for each wall.");
    if (d.walls.some((w) => w.ref && !(Number.isInteger(Number(w.courses)) && Number(w.courses) >= 0))) e.push("Courses must be whole numbers.");
  }
  if (d.step === 2) {
    if (!d.photos.some((p) => p.kind === "photo")) e.push("Add at least one work photo.");
    if (d.type === "substructure" && !d.photos.some((p) => p.kind === "drawing")) e.push("Add a photo or scan of the foundation drawing.");
    if (d.type === "daywork" && !d.photos.some((p) => p.kind === "daywork_sheet")) e.push("Add the signed client daywork sheet.");

}
function submitDraft() {
  const d = S.draft, st = site(d.site), e = [];
  for (let s = 0; s < 3; s++) e.push(...validateStep({ ...d, step: s }));
  if (d.type !== "supervision" && !d.foreman) e.push("The client foreman must sign this stage.");
  const lines = priceLines(d);
  if (lines.some((l) => l.rate == null)) e.push("A rate is not set for one of the items. The office has been flagged.");
  lines.filter((l) => l.unit === "%").forEach((l) => { const left = 100 - liftClaimed(d.site, d.plot, l.key, d.editing); if (l.qty > left) e.push(`${l.desc}: only ${Math.max(0, left)}% of this lift is left to claim.`); });
  const total = lines.reduce((a, l) => a + (l.value || 0), 0);
  const payees = S.payees.filter((p) => p.gang === myGang && p.cleared);
  const split = Object.fromEntries(payees.map((p) => [p.id, P(d.split[p.id] || 0)]).filter(([, v]) => v > 0));
  const sum = Object.values(split).reduce((a, b) => a + b, 0);
  if (Object.values(split).some((v) => v < 0)) e.push("Split amounts must be zero or more.");
  if (sum > total) e.push("The split adds up to more than the claim value.");
  if (sum === 0 && total > 0) e.push("Allocate the claim value between your gang members.");
  if (e.length) { msg = { kind: "err", text: e.join("\n") }; return render(); }
  const we = weekEnding(); const { run, late } = runFor(we);
  const flags = [];
  if (sum < total) flags.push(`Split is ${gbp(total - sum)} less than the claim value.`);
  if (late) flags.push("Submitted after the cut-off for its pay run. Rolled to the next pay run.");
  if (!run) flags.push(`No open pay run covers week ending ${fmtD(we)}.`);
  let c = d.editing ? S.claims.find((x) => x.id === d.editing) : null;
  const data = { gang: myGang, site: d.site, plot: d.plot, type: d.type, workDate: d.workDate, weekEnding: we, run: run?.id || null, status: "awaiting",
    lines: lines.map(({ key, sup, desc, unit, qty, rate, from }) => ({ key, sup, desc, unit, qty, rate, from })), walls: d.walls.filter((w) => w.ref).map((w) => ({ ref: w.ref, courses: Number(w.courses) })),
    notes: d.notes, photos: d.photos, foreman: d.foreman, split, flags };
  if (c) Object.assign(c, data); else { c = Object.assign({ id: String(S.seq++), created: new Date().toISOString(), history: [] }, data); S.claims.push(c); }
  audit(c, "Submitted");
  S.draft = null; save();
  msg = { kind: "ok", text: `KS-${c.id} submitted for K-S sign-off. Week ending ${fmtD(we)}.` };
  go("claim-" + c.id);
}

  const out = [];
  for (const part of spec.split(",").map((s) => s.trim()).filter(Boolean)) {

    if (m) { const a = Number(m[1]), b = Number(m[2]); if (b < a || b - a > 500) return null; for (let i = a; i <= b; i++) out.push(String(i)); }
    else out.push(part.slice(0, 20));
  }
  return out;
}

      <td>${x.job && x.client ? '<span class="badge b-approved">Gangs can claim</span>' : '<span class="badge b-returned">Needs client and job</span>'}
        <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn ghost sm" data-a="savesite" data-id="${x.id}" type="button">Save</button>
        <button class="btn ghost sm" data-a="togglesite" data-id="${x.id}" type="button">${x.active ? "Close site" : "Reopen"}</button></div>${x.active ? "" : '<div class="small muted">Closed</div>'}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="card accent"><h3>Add a site</h3>
      <p class="small muted" style="margin:0">Site, client, job number and plots in one go. Only the site name is required.</p>
      <div class="row"><div><label for="as-name">Site name</label><input id="as-name" type="text"></div><div><label for="as-job">Job number</label><input id="as-job" type="text"></div></div>
      <div class="row"><div><label for="as-client">Client (who K-S invoices)</label><select id="as-client">${clientOpts("")}</select></div>
        <div><label for="as-newclient">Or a new client</label><input id="as-newclient" type="text" placeholder="Type a new client name"></div></div>
      <div class="row"><div><label for="as-plots">Plots<span class="hint">For example 1-20, 25, 30A</span></label><input id="as-plots" type="text"></div>
        <div><label for="as-ht">House type</label><input id="as-ht" type="text"></div></div>
      <button class="btn" data-a="addsite" type="button" style="justify-self:start">Add site</button></div></div>`;
}

// ----- gang rates (management) -----
function rates() {
  const today = iso(new Date());
  return `<div class="head"><div><div class="eyebrow">Management</div><h1>Gang pay rates</h1></div></div>
    <div class="stack"><div class="alert info">Gang pay rates only. Client charge rates are kept in the restricted margin area. Foremen never see rates; gangs see their own only at the last step of a claim.</div>
    <p class="small muted" style="margin:0">Order used on a claim (to be confirmed by K-S): individual agreed rate, then a client-specific set, then the gang's base set. A rate with a future date is an uplift.</p>
    ${Object.entries(S.rateSets).map(([k, s]) => `<div class="card"><h3>${esc(s.name)} <span class="badge">${s.kind}</span></h3>
      <div class="tw"><table><thead><tr><th>Item</th><th class="num">Current rate</th><th>Since</th><th>Scheduled</th></tr></thead><tbody>
      ${[...new Set(s.rates.map((x) => x.item))].map((it) => { const all = s.rates.filter((x) => x.item === it); const cur = all.filter((x) => x.from <= today).sort((a, b) => (a.from < b.from ? 1 : -1))[0]; const fut = all.filter((x) => x.from > today);
        return `<tr><td>${itemName(it)}</td><td class="num">${cur ? rateFmt(cur.rate) : "none"}</td><td>${cur ? fmtD(cur.from) : ""}</td><td class="small">${fut.map((f) => `${rateFmt(f.rate)} from ${fmtD(f.from)}`).join("; ")}</td></tr>`; }).join("")}</tbody></table></div>
      <div class="row" style="align-items:end"><div><label for="ri-${k}">Item</label><select id="ri-${k}">${[...REF.items.map((i) => [i.id, i.name]), ["DAYWORK", "Daywork"]].map(([v, n]) => `<option value="${v}">${n}</option>`).join("")}</select></div>
        <div><label for="rr-${k}">Rate (£)</label><input id="rr-${k}" type="number" min="0" step="0.0001"></div><div><label for="rd-${k}">Effective from</label><input id="rd-${k}" type="date" value="${today}"></div>
        <div><button class="btn" data-a="addrate" data-id="${k}" type="button">Save rate</button></div></div></div>`).join("")}
    <h2 style="margin:6px 0 0">Gang members cleared for payment</h2>
    <p class="small muted" style="margin:0">Onboarding and checks are done by the payment company. Only cleared members can receive a split.</p>
    <div class="tw"><table><thead><tr><th>Member</th><th>Gang</th><th>Entity</th><th>Status</th></tr></thead><tbody>
    ${S.payees.map((p) => `<tr><td>${esc(p.name)}</td><td>${esc(S.gangs[p.gang].name)}</td><td>${p.entity}</td><td><span class="badge ${p.cleared ? "b-approved" : "b-returned"}">${p.cleared ? "Cleared" : "Not cleared"}</span> <button class="btn ghost sm" data-a="clear" data-id="${p.id}" type="button">${p.cleared ? "Remove" : "Mark cleared"}</button></td></tr>`).join("")}
    </tbody></table></div></div>`;
}

// ----- margin (named list only) -----
function clientValue(c, l) {
  const r = (S.clientRates[site(c.site).client] || {})[l.key];
  if (r == null) return 0;
  if (l.unit === "%") return Math.round(l.qty * P(r) / 100);
  return lineP(l.qty, r);
}
function margin() {
  if (!isNamed()) return `<div class="alert err">Page not found.</div>`;
  const groups = { gang: (c) => S.gangs[c.gang].name, site: (c) => site(c.site).name, client: (c) => client(site(c.site).client).name, week: (c) => fmtD(c.weekEnding) };
  const g = S.marginGroup || "gang";
  const agg = {};
  S.claims.filter((c) => ["awaiting", "approved", "paid"].includes(c.status)).forEach((c) => c.lines.forEach((l) => {
    const k = groups[g](c); const a = (agg[k] ||= { cost: 0, value: 0 }); a.cost += val(l); a.value += clientValue(c, l);
  }));
  const rows = Object.entries(agg).sort();
  const tc = rows.reduce((a, [, x]) => a + x.cost, 0), tv = rows.reduce((a, [, x]) => a + x.value, 0);
  const pct = (cost, value) => value ? ((value - cost) / value * 100).toFixed(1) + "%" : "";
  return `<div class="stack"><div class="restricted">Restricted: client charge rates, client values and margin. Only the named list sees this page. In the real app every view and export is logged.</div>
    <div class="head" style="margin:0"><div><div class="eyebrow">Commercial</div><h1>Margin</h1></div>
      <div class="actions"><label for="mg" class="small" style="margin:0;align-self:center">Group by</label><select id="mg" style="width:auto">${Object.keys(groups).map((k) => `<option value="${k}" ${g === k ? "selected" : ""}>${{ gang: "Gang", site: "Site", client: "Client", week: "Week ending" }[k]}</option>`).join("")}</select></div></div>
    <div class="tw"><table><thead><tr><th>${{ gang: "Gang", site: "Site", client: "Client", week: "Week ending" }[g]}</th><th class="num">Gang cost</th><th class="num">Client value</th><th class="num">Margin</th><th class="num">Margin %</th></tr></thead><tbody>
    ${rows.map(([k, x]) => `<tr><td>${esc(k)}</td><td class="num">${gbp(x.cost)}</td><td class="num">${gbp(x.value)}</td><td class="num" style="color:${x.value - x.cost < 0 ? "var(--bad)" : "inherit"}">${gbp(x.value - x.cost)}</td><td class="num">${pct(x.cost, x.value)}</td></tr>`).join("")}
    <tr><td><strong>Total</strong></td><td class="num"><strong>${gbp(tc)}</strong></td><td class="num"><strong>${gbp(tv)}</strong></td><td class="num"><strong>${gbp(tv - tc)}</strong></td><td class="num"><strong>${pct(tc, tv)}</strong></td></tr></tbody></table></div>
    <p class="small muted" style="margin:0">Submitted, approved and paid claims at gang cost after pay-less reductions.</p>
    <h2 style="margin:6px 0 0">Client charge rates</h2><div class="tw"><table><thead><tr><th>Client</th><th>Item</th><th class="num">Client rate</th></tr></thead><tbody>
    ${Object.entries(S.clientRates).flatMap(([cid, r]) => Object.entries(r).map(([k, v]) => `<tr><td>${esc(client(cid).name)}</td><td>${k === "SUP" ? "Supervision (weekly)" : ["L1", "L2", "PATCH"].includes(k) ? REF.lifts.find((l) => l.id === k).name + " (per plot)" : itemName(k)}</td><td class="num">${rateFmt(v)}</td></tr>`)).join("")}
    </tbody></table></div></div>`;
}

// ----- snags -----
function snags() {
  const list = S.snags.filter((n) => !isGang() || n.gang === myGang);
  const canRaise = role() !== "gang";
  const label = { open: "Open", in_progress: "In progress", ready: "Ready to close", closed: "Closed" };
  return `<div class="head"><div><div class="eyebrow">Site communication</div><h1>Snags</h1></div></div><div class="stack">
    ${list.map((n) => `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3 style="margin:0">${esc(n.title)}</h3><span class="badge">${label[n.status]}</span></div>
      <div class="small muted">${esc(site(n.site).name)}${n.plot ? ` · Plot ${esc(n.plot)}` : ""} · ${esc(S.gangs[n.gang].name)}${n.due ? ` · due ${fmtD(n.due)}` : ""}</div>
      ${n.detail ? `<div>${esc(n.detail)}</div>` : ""}
      ${n.updates.map((u) => `<div class="small"><strong>${esc(u.who)}</strong> ${fmtDT(u.at)}: ${esc(u.text)}</div>`).join("")}
      ${n.status !== "closed" ? `<div class="row" style="align-items:end"><div><label for="su-${n.id}">Update</label><input id="su-${n.id}" type="text"></div>
        <div><label for="ss-${n.id}">Status</label><select id="ss-${n.id}"><option value="">No change</option>${(isGang() ? ["in_progress", "ready"] : ["open", "in_progress", "ready", "closed"]).map((s) => `<option value="${s}">${label[s]}</option>`).join("")}</select></div>
        <div><button class="btn ghost" data-a="snagupd" data-id="${n.id}" type="button">Save</button></div></div>` : ""}</div>`).join("") || '<div class="muted">No snags.</div>'}
    ${canRaise ? `<div class="card accent"><h3>Raise a snag</h3><div class="row"><div><label for="ns-site">Site</label><select id="ns-site">${S.sites.filter((x) => x.active).map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
      <div><label for="ns-gang">Assign to gang</label><select id="ns-gang">${Object.entries(S.gangs).map(([k, g]) => `<option value="${k}">${esc(g.name)}</option>`).join("")}</select></div>
      <div><label for="ns-due">Due</label><input id="ns-due" type="date"></div></div>
      <div><label for="ns-title">Title</label><input id="ns-title" type="text"></div><div><label for="ns-detail">Details</label><textarea id="ns-detail"></textarea></div>
      <button class="btn" data-a="raisesnag" type="button" style="justify-self:start">Raise snag</button></div>` : ""}</div>`;
}

// ---------- actions ----------
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.id === "mg") { S.marginGroup = t.value; save(); return render(); }
  if (t.id === "w-type" || t.id === "w-site") { readDraftInputs(); save(); return render(); }
  if (t.dataset.sp !== undefined) { readDraftInputs(); save(); return render(); }
  if (t.dataset.file) {
    readDraftInputs();
    const enh = document.querySelector(`[data-enh="${t.dataset.file}"]`)?.checked;
    for (const f of [...t.files].slice(0, 6)) {
      let src = "";
      try { src = await compress(f, enh); } catch { /* keep the record without a preview */ }
      S.draft.photos.push({ kind: t.dataset.file, name: f.name, src });
    }
    save(); toast("Uploaded."); render();
  }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, d = S.draft;
  if (["next", "back", "sign", "submit", "equal", "addwall", "rmphoto", "clearsig", "discard"].includes(a)) readDraftInputs();
  if (a === "next") { const err = validateStep(d); if (err.length) { msg = { kind: "err", text: err.join("\n") }; } else { d.step += (d.step === 2 && d.type === "supervision") ? 2 : 1; } save(); return render(); }
  if (a === "back") { d.step -= (d.step === 4 && d.type === "supervision") ? 2 : 1; save(); return render(); }
  if (a === "discard") { S.draft = null; save(); msg = { kind: "ok", text: "Claim discarded." }; return go("claims"); }
  if (a === "addwall") { d.walls.push({ ref: "", courses: "" }); save(); return render(); }
  if (a === "rmphoto") { d.photos.splice(Number(b.dataset.i), 1); save(); return render(); }
  if (a === "clearsig") return initSig();
  if (a === "sign") {
    const name = $("#fm-name").value.trim();
    if (name.length < 3 || !sigData) { msg = { kind: "err", text: [name.length < 3 ? "The foreman must type their full name." : "", !sigData ? "The foreman must sign in the box." : ""].filter(Boolean).join("\n") }; return render(); }
    d.foreman = { name, at: new Date().toISOString(), sig: sigData }; d.step = 4; save(); return render();
  }
  if (a === "equal") {
    const total = priceLines(d).reduce((x, l) => x + (l.value || 0), 0), ps = S.payees.filter((p) => p.gang === myGang && p.cleared);
    rescale(ps.map(() => 1), total).forEach((v, i) => (d.split[ps[i].id] = (v / 100).toFixed(2))); save(); return render();
  }
  if (a === "submit") return submitDraft();
  if (a === "correct") {
    const c = S.claims.find((x) => x.id === id);
    S.draft = { step: 1, type: c.type, site: c.site, plot: c.plot, workDate: c.workDate, qty: Object.fromEntries(c.lines.map((l) => [l.sup || l.key, String(l.qty)])),
      walls: c.walls.length ? c.walls.map((w) => ({ ref: w.ref, courses: String(w.courses) })) : [{ ref: "", courses: "" }], notes: c.notes, photos: c.photos, foreman: null, split: {}, editing: c.id };
    save(); return go("new");
  }
  const c = id && S.claims.find((x) => x.id === id);
  if (a === "approve") { c.status = "approved"; audit(c, "Approved"); save(); msg = { kind: "ok", text: "Claim approved." }; return render(); }
  if (a === "return") { const n = $("#ret-note").value.trim(); if (n.length < 3) { msg = { kind: "err", text: "Say what needs fixing." }; return render(); } c.status = "returned"; c.returnNote = n; audit(c, "Returned: " + n); save(); msg = { kind: "ok", text: "Returned to the gang." }; return render(); }
  if (a === "reduce") {
    const l = c.lines[Number($("#pl-line").value)], q = Number($("#pl-qty").value), note = $("#pl-note").value.trim(), reason = $("#pl-reason").value;
    const errs = [];
    if (!($("#pl-qty").value !== "" && q >= 0 && q < l.qty)) errs.push("A pay-less reduction must lower the quantity.");
    if (note.length < 5) errs.push("Explain the reduction in the note.");
    if (errs.length) { msg = { kind: "err", text: errs.join("\n") }; return render(); }
    const before = val(l);
    if (l.origQty == null) { l.origQty = l.qty; l.origValue = before; }
    l.qty = q;
    if (!c.splitOriginal) c.splitOriginal = { ...c.split };
    const ids = Object.keys(c.split), oldSum = ids.reduce((x, k) => x + c.split[k], 0);
    rescale(ids.map((k) => c.split[k]), Math.min(oldSum, claimTotal(c))).forEach((v, i) => (c.split[ids[i]] = v));
    audit(c, `Pay-less: ${l.desc} ${l.origQty} to ${q} (${gbp(before)} to ${gbp(val(l))}). ${reason}. ${note}`);
    save(); msg = { kind: "ok", text: "Reduction recorded. Split rescaled." }; return render();
  }
  if (a === "invoices") { const r = S.runs.find((x) => x.id === id); r.invoices ||= {}; let n = 0; Object.keys(payeeTotals(id)).forEach((pid) => { if (!r.invoices[pid]) { r.invoices[pid] = S.invSeq++; n++; } }); save(); msg = { kind: "ok", text: `${n} invoice${n === 1 ? "" : "s"} generated, one per gang member paid. In the real app each is a PDF.` }; return render(); }
  if (a === "paid") { const r = S.runs.find((x) => x.id === id); if (S.claims.some((x) => x.run === id && x.status === "awaiting")) { msg = { kind: "err", text: "Some claims in this run still need sign-off." }; return render(); } r.status = "paid"; S.claims.filter((x) => x.run === id && x.status === "approved").forEach((x) => (x.status = "paid")); save(); msg = { kind: "ok", text: "Pay run marked as paid." }; return render(); }
  if (a === "copycsv") { const ta = $("#csv"); navigator.clipboard?.writeText(ta.value).then(() => toast("CSV copied."), () => { ta.select(); toast("Selected. Copy with your keyboard."); }) ?? (ta.select(), toast("Selected. Copy with your keyboard.")); return; }
  if (a === "addsite") {
    const name = $("#as-name").value.trim(), job = $("#as-job").value.trim(), newc = $("#as-newclient").value.trim();
    const plots = parsePlots($("#as-plots").value);
    const errs = [];
    if (name.length < 2) errs.push("Enter the site name.");
    if (!plots) errs.push("Check the plot numbers, for example 1-20, 25.");
    if (S.sites.some((x) => x.name.toLowerCase() === name.toLowerCase())) errs.push("A site with that name already exists.");
    if (errs.length) { msg = { kind: "err", text: errs.join("\n") }; return render(); }
    let cid = $("#as-client").value;
    if (newc) { cid = "C" + Date.now(); S.clients[cid] = { name: newc, weeks: 1, ownForms: false }; }
    S.sites.push({ id: "S" + Date.now(), name, client: cid || "", job, houseType: $("#as-ht").value.trim() || "Not set", plots, active: true });
    save(); msg = { kind: "ok", text: `${name} added.${cid && job ? " Gangs can now claim on it." : " Add a client and job number so gangs can claim."}` }; return render();
  }
  if (a === "savesite") { const x = site(id); x.client = $("#sc-" + id).value; x.job = $("#sj-" + id).value.trim(); save(); msg = { kind: "ok", text: `${x.name} saved.` }; return render(); }
  if (a === "togglesite") { const x = site(id); x.active = !x.active; save(); return render(); }
  if (a === "addplots") {
    const x = site(id), more = parsePlots($("#sp2-" + id).value);
    if (!more || !more.length) { msg = { kind: "err", text: "Enter plot numbers, for example 7-12." }; return render(); }
    more.forEach((n) => { if (!x.plots.includes(n)) x.plots.push(n); }); save(); msg = { kind: "ok", text: `Plots added to ${x.name}.` }; return render();
  }
  if (a === "addrate") { const r = Number($("#rr-" + id).value), dt = $("#rd-" + id).value; if (!(r >= 0) || $("#rr-" + id).value === "" || !dt) { msg = { kind: "err", text: "Enter a rate and a date." }; return render(); } S.rateSets[id].rates.push({ item: $("#ri-" + id).value, rate: r, from: dt }); save(); msg = { kind: "ok", text: "Rate saved." }; return render(); }
  if (a === "clear") { const p = S.payees.find((x) => x.id === id); p.cleared = !p.cleared; save(); return render(); }
  if (a === "raisesnag") { const t = $("#ns-title").value.trim(); if (t.length < 3) { msg = { kind: "err", text: "Give the snag a title." }; return render(); } S.snags.unshift({ id: "N" + Date.now(), site: $("#ns-site").value, gang: $("#ns-gang").value, due: $("#ns-due").value, title: t, detail: $("#ns-detail").value.trim(), status: "open", updates: [] }); save(); msg = { kind: "ok", text: "Snag raised." }; return render(); }
  if (a === "snagupd") { const n = S.snags.find((x) => x.id === id), text = $("#su-" + id).value.trim(), st = $("#ss-" + id).value; if (!text && !st) { msg = { kind: "err", text: "Add an update or change the status." }; return render(); } n.updates.push({ who: { gang: "Alex Demo", cm: "Demo Contracts Manager", manager: "Demo Manager", named: "Demo Director" }[role()], at: new Date().toISOString(), text: text || "Status changed" }); if (st) n.status = st; save(); return render(); }
});
render();
})();
</script>

</body>
